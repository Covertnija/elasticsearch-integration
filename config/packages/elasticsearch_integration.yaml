elasticsearch_integration:
    # Enable or disable Elasticsearch integration
    enabled: '%env(bool:ELASTICSEARCH_ENABLED)%'

    # Array of Elasticsearch host URLs (comma-separated in env)
    hosts: '%env(csv:ELASTICSEARCH_HOSTS)%'

    # Elasticsearch API key for authentication
    api_key: '%env(default::ELASTICSEARCH_API_KEY)%'

    # Default Elasticsearch index name
    index: '%env(ELASTICSEARCH_INDEX)%'

    # Minimum log level sent to Elasticsearch (debug, info, notice, warning,
    # error, critical, alert, emergency); MonologBundle ignores `level`
    # for `type: service` handlers, so the bundle applies it itself.
    # May be an env placeholder, e.g. '%env(LOG_LEVEL)%'
    level: debug

    # Bulk action type; use "create" for Elasticsearch data streams
    op_type: index

    # HTTP timeout in seconds for Elasticsearch requests (idle and total)
    timeout: 5.0

    # Seconds to stop sending logs after a failure
    retry_after_seconds: 300

    # PSR-6 cache pool service id used to share the send suspension across
    # processes (e.g. PHP-FPM workers); set to null to disable
    cache_pool: cache.app

    # Additional Elasticsearch client options
    # Supported: retries, sslVerification, elasticCloudId, timeout,
    # resurrectAfterSeconds
    client_options: {}
        # retries: 3
        # sslVerification: true
        # resurrectAfterSeconds: 60
